[project]
name = "relik-rag-experiments"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "datasets>=2.13,<2.15",
    "llama-index-core>=0.14.25",
    "llama-index-embeddings-huggingface>=0.8.0",
    "numpy==1.26.4",
    "ollama>=0.6.2",
    "openai>=3.17.0",
    "relik>=1.0.7",
    "setuptools<82",
]

[project.scripts]
relik-rag-experiments = "relik_rag_experiments:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pip>=26.2.1",
]
